services:
  agent:
    build:
      context: .
      target: development
    environment:
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_PACKAGER_HOSTNAME}
    ports:
      - "8082:8082"
    volumes:
      - .:/app
      - agent_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/status').then(r=>r.text()).then(t=>{if(t.trim()!=='packager-status:running')process.exit(1)})"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  agent_node_modules:
